name: DG-ReID CI

on:
  push:
    branches: [ main, rectified, dg-reid-training ]
  pull_request:
    branches: [ main, rectified ]

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install timm ftfy regex pyyaml pillow tabulate

    - name: Run 8-Check Report Verification Suite
      run: |
        python tests/test_smoke.py

    - name: Run End-to-End Pipeline Integration Test
      run: |
        python tests/test_pipeline.py

    - name: Test Table & Results Generation
      run: |
        python experiments/generate_tables.py
