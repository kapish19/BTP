# Occlusion Robustness Evaluation Configuration
# Evaluates trained models across Clean, Mild (15%), Moderate (30%), and Severe (50%) occlusion
# Table 8 reproduction

experiment_name: "occlusion_robustness_benchmark"
benchmark: "protocol2"
held_out_domain: "Market"
test_datasets: ["Market"]

eval_protocols:
  - severity: "clean"
    area_fraction: 0.0
  - severity: "mild"
    area_fraction: 0.15
  - severity: "moderate"
    area_fraction: 0.30
  - severity: "severe"
    area_fraction: 0.50

models_to_evaluate:
  - name: "Global Baseline"
    disable_grl: true
    disable_part_branch: true
    eval_feat: "global"
  - name: "+ Part Branch (No Visibility)"
    disable_grl: true
    disable_part_branch: false
    disable_vis_gating: true
    eval_feat: "combined"
  - name: "Full DG-ReID"
    disable_grl: false
    disable_part_branch: false
    disable_vis_gating: false
    eval_feat: "combined"
